<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div>
        <form id="form-cadastro">
            <h1>Cadastro</h1>
            <label for="ipt-nome">Nome:</label>
            <input type="text" id="ipt-nome" name="nome">
            <br>
            <label for="ipt-email">Email:</label>
            <input type="email" id="ipt-email" name="email" required>
            <br>
            <label for="ipt-senha">Senha:</label>
            <input type="password" id="ipt-senha" name="senha" required>
            <br>
            <label for="ipt-cep">CEP:</label>
            <input type="text" id="ipt-cep" name="cep">
            <br>
            <label for="ipt-rua">Rua:</label>
            <input type="text" id="ipt-rua" name="rua">
            <br>
            <label for="ipt-bairro">Bairro:</label>
            <input type="text" id="ipt-bairro" name="bairro">
            <br>
            <label for="ipt-cidade">Cidade:</label>
            <input type="text" id="ipt-cidade" name="cidade">
            <br>

            <button type="submit">Cadastrar</button>

            <p> Já possui cadastro? <a href="index.html">Entrar</a> </p>

        </form>
    </div>
</body>
<script src="script.js"></script>
</html>
